services:
  mysql-db:
    image: mysql:8.0
    container_name: helpdesk-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Helpdesk123*
      MYSQL_DATABASE: helpdeskdb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pHelpdesk123*"]
      interval: 5s
      timeout: 5s
      retries: 5

  helpdesk-api:
    build: .
    container_name: helpdesk-running
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=mysql-db;Port=3306;Database=helpdeskdb;Uid=root;Pwd=Helpdesk123*;
    depends_on:
      mysql-db:
        condition: service_healthy

volumes:
  mysql_data: